<script>
const config=JSON.parse(document.getElementById('card-config').textContent);
const editor=document.getElementById('editor');
function openSettings(){for(const key of Object.keys(config)) document.getElementById(key).value=config[key];editor.showModal()}
document.getElementById('settings').onclick=openSettings;
document.getElementById('close').onclick=()=>editor.close();
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
for(const [id,key] of [['line','lineUrl'],['products','productUrl']]){const a=document.getElementById(id);if(config[key]){a.href=config[key];a.target='_blank';a.rel='noopener noreferrer'}else a.onclick=e=>{e.preventDefault();alert('ยังไม่ได้ใส่ลิงก์ กรุณาตั้งค่าข้อมูลก่อนใช้งาน');openSettings()}}
const escapeV=v=>String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
document.getElementById('save').onclick=e=>{e.preventDefault();const lines=['BEGIN:VCARD','VERSION:3.0','N:Payaksri;Thitima;;;','FN:Thitima Payaksri','NICKNAME:Jen','ORG:Bronson & Jacobs International','TITLE:Sale Executive (Jen)'];if(config.phone)lines.push('TEL;TYPE=CELL:'+escapeV(config.phone));if(config.email)lines.push('EMAIL:'+escapeV(config.email));if(config.lineUrl)lines.push('URL:'+escapeV(config.lineUrl));lines.push('END:VCARD');download(lines.join('\r\n')+'\r\n','Thitima_Payaksri.vcf','text/vcard;charset=utf-8')};
document.getElementById('form').onsubmit=e=>{e.preventDefault();for(const key of Object.keys(config))config[key]=document.getElementById(key).value.trim();for(const key of ['lineUrl','productUrl']){if(config[key]&&!/^https?:\/\//i.test(config[key])){alert('กรุณาใช้ลิงก์ที่ขึ้นต้นด้วย https:// หรือ http://');return}}const copy=document.documentElement.cloneNode(true);copy.querySelector('#card-config').textContent=JSON.stringify(config).replace(/</g,'\\u003c');copy.querySelector('dialog').removeAttribute('open');download('<!doctype html>\n'+copy.outerHTML,'Jen_Name_Card.html','text/html;charset=utf-8');editor.close()};
</script></body></html>
